services:
  postgres:
    image: postgres:18-alpine
    container_name: vinted-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-vinted}
      POSTGRES_USER: ${DB_USER:-vinted}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    # Localhost only, for a bot running natively on the host (deploy/run-local.sh). Never 0.0.0.0.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vinted} -d ${DB_NAME:-vinted}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.slim
    container_name: vinted-bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-vinted_parser_bot}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vinted}
      DB_USER: ${DB_USER:-vinted}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SELENIUM_ENABLED: "false"
      VINTED_PROXY: ${VINTED_PROXY:-}
      VINTED_PROXIES: ${VINTED_PROXIES:-}
      MONITOR_RPM_PER_IP: ${MONITOR_RPM_PER_IP:-20}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-20000}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25 -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError}
    mem_limit: 1g
    volumes:
      - botlogs:/app/logs
    restart: unless-stopped

volumes:
  # Postgres 18 data. An older `pgdata` volume from Postgres 16 is left untouched.
  pgdata18:
  botlogs:
