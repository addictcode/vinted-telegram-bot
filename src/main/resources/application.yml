spring:
  application:
    name: vinted-telegram-bot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vinted}
    username: ${DB_USER:vinted}
    password: ${DB_PASSWORD:vinted}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

telegram:
  bot:
    # NEVER hardcode the token. Provide it via the BOT_TOKEN environment variable.
    token: ${BOT_TOKEN:}
    username: ${BOT_USERNAME:vinted_parser_bot}

vinted:
  parser:
    # Primary parsing is lightweight HTTP (Jsoup). Headless Chrome is only a
    # fallback and can be disabled on minimal hosts that have no browser.
    selenium-enabled: ${SELENIUM_ENABLED:true}
    # Use headless Chrome for JS-rendered content.
    headless: true
    # Explicit chromedriver path (optional). If empty, WebDriverManager resolves it.
    chrome-driver-path: ${CHROME_DRIVER_PATH:}
    chrome-binary-path: ${CHROME_BINARY_PATH:}
    page-load-timeout-seconds: 30
    # Delay between outbound requests, randomised in [min,max] milliseconds.
    min-delay-ms: 2000
    max-delay-ms: 5000
    # Network retry attempts on failure.
    max-retries: 3
    # Optional HTTP/SOCKS proxy, e.g. http://user:pass@host:port
    proxy: ${VINTED_PROXY:}
    # Proxy pool for the catalog poller (rotated per request, one session per proxy).
    # More IPs = more request budget = safely faster polling. Residential > datacenter.
    proxies: ${VINTED_PROXIES:}
    proxy-cooldown-ms: ${VINTED_PROXY_COOLDOWN_MS:120000}
    image-cache-dir: ${IMAGE_CACHE_DIR:/tmp/vinted_images}
    referer: https://www.vinted.com/
    accept-language: en-US,en;q=0.9
  monitor:
    # Near-real-time polling of saved catalog searches via Vinted's JSON API
    # (~40 KB per poll). New listings are pushed to the chat within seconds.
    enabled: ${MONITOR_ENABLED:true}
    interval-ms: ${MONITOR_INTERVAL_MS:20000}    # 20 seconds (normal subscriptions)
    snipe-interval-ms: ${MONITOR_SNIPE_INTERVAL_MS:5000}   # ⚡ snipe-mode subscriptions
    requests-per-minute-per-ip: ${MONITOR_RPM_PER_IP:20}  # safe budget; snipe interval stretches to respect it
    tick-ms: 1000                                           # how often due subscriptions are picked up
    initial-delay-ms: 15000
    max-new-per-cycle: 5
    per-page: 24
    backoff-ms: ${MONITOR_BACKOFF_MS:180000}     # pause after anti-bot block (now scoped to the blocked host only)
    max-concurrent-checks: ${MONITOR_MAX_CONCURRENT_CHECKS:8}     # total parallel subscription checks
    max-concurrent-per-host: ${MONITOR_MAX_CONCURRENT_PER_HOST:2} # cap per Vinted domain, avoids bursty request patterns

rate-limit:
  # Cap on manual actions (parse / add search / check-now) per user per hour.
  # High default so a personal bot never trips it; lower it for a public deploy.
  free-requests-per-hour: ${FREE_REQUESTS_PER_HOUR:1000}

logging:
  level:
    root: INFO
    com.example.vintedbot: DEBUG
    org.openqa.selenium: WARN
  file:
    name: logs/vinted-bot.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

server:
  shutdown: graceful
