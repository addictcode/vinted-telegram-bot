# In-memory H2 in PostgreSQL-compatibility mode so entity mappings (text,
# double precision, timestamptz) behave like production. Schema is generated
# from the JPA entities; Flyway is disabled for the test slice.
spring.datasource.url=jdbc:h2:mem:vintedtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
telegram.bot.token=
